<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="tex"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="9" result="n"/>
      <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="2" diffuseConstant="1" result="l">
        <feDistantLight azimuth="235" elevation="55"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceGraphic" operator="in" result="li"/>
      <feBlend in="SourceGraphic" in2="li" mode="multiply"/></filter>
    <radialGradient id="p" cx="38%" cy="32%" r="78%">
      <stop offset="0" stop-color="#fdf9f0"/><stop offset="55%" stop-color="#e6ddcb"/><stop offset="1" stop-color="#b3a88f"/>
    </radialGradient>
    <filter id="s"><feGaussianBlur stdDeviation="10"/></filter>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#7a5833"/><stop offset="1" stop-color="#4c371d"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="268" cy="300" rx="150" ry="90" fill="#000" opacity="0.35" filter="url(#s)"/>
  <ellipse cx="256" cy="260" rx="150" ry="120" fill="url(#p)" filter="url(#tex)"/>
  <ellipse cx="206" cy="205" rx="60" ry="34" fill="#fff" opacity="0.55"/>
  <text x="256" y="470" font-family="Georgia, serif" font-size="30" fill="#f0e6d0" text-anchor="middle" opacity="0.8">Goat = smooth white pebble</text>
</svg>
