<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780">
  <rect width="920" height="780" fill="#1b1c1a"/>

  <!-- ===== chalk lines ===== -->
  <g stroke="#e9e2d2" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- apex triangle + center spoke -->
    <path d="M450 90 L315 250 M450 90 L585 250 M450 90 L450 250"/>
    <!-- top line -->
    <path d="M180 250 H720"/>
    <!-- middle line -->
    <path d="M180 430 H720"/>
    <!-- bottom line (narrow) -->
    <path d="M315 610 H585"/>
    <!-- verticals top->mid -->
    <path d="M180 250 V430 M315 250 V430 M450 250 V430 M585 250 V430 M720 250 V430"/>
    <!-- verticals mid->bottom -->
    <path d="M315 430 V610 M450 430 V610 M585 430 V610"/>
    <!-- corner triangles -->
    <path d="M180 250 L90 210 M180 250 L90 300 M90 210 L90 300"/>       <!-- TL -->
    <path d="M720 250 L775 150 M720 250 L830 200 M775 150 L830 200"/>   <!-- TR -->
    <path d="M720 430 L830 390 M720 430 L830 470 M830 390 L830 470"/>   <!-- MR -->
    <path d="M180 430 L95 500 M180 430 L150 560 M95 500 L150 560"/>     <!-- BL -->
  </g>

  <!-- ===== tigers (4): dark ===== -->
  <g fill="#1c140d" stroke="#e0b06a" stroke-width="3">
    <circle cx="450" cy="90" r="22"/><circle cx="315" cy="250" r="22"/><circle cx="450" cy="250" r="22"/><circle cx="585" cy="250" r="22"/>
  </g>
  <g fill="#e0b06a" font-family="Georgia" font-size="18" text-anchor="middle" font-weight="bold">
    <text x="450" y="96">T</text><text x="315" y="256">T</text><text x="450" y="256">T</text><text x="585" y="256">T</text>
  </g>

  <!-- ===== other points (18): light ===== -->
  <g fill="#efe9db" stroke="#8a8172" stroke-width="2">
    <circle cx="180" cy="250" r="18"/><circle cx="720" cy="250" r="18"/>
    <circle cx="180" cy="430" r="18"/><circle cx="315" cy="430" r="18"/><circle cx="450" cy="430" r="18"/><circle cx="585" cy="430" r="18"/><circle cx="720" cy="430" r="18"/>
    <circle cx="315" cy="610" r="18"/><circle cx="450" cy="610" r="18"/><circle cx="585" cy="610" r="18"/>
    <!-- 8 triangle tips -->
    <circle cx="90" cy="210" r="16"/><circle cx="90" cy="300" r="16"/>
    <circle cx="775" cy="150" r="16"/><circle cx="830" cy="200" r="16"/>
    <circle cx="830" cy="390" r="16"/><circle cx="830" cy="470" r="16"/>
    <circle cx="95" cy="500" r="16"/><circle cx="150" cy="560" r="16"/>
  </g>

  <!-- ===== node numbers ===== -->
  <g fill="#b06a2a" font-family="Georgia" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="450" y="60">1</text><text x="315" y="222">2</text><text x="450" y="222">3</text><text x="585" y="222">4</text>
    <text x="180" y="222">5</text><text x="720" y="222">6</text>
    <text x="180" y="402">7</text><text x="315" y="402">8</text><text x="450" y="402">9</text><text x="585" y="402">10</text><text x="720" y="402">11</text>
    <text x="315" y="582">12</text><text x="450" y="582">13</text><text x="585" y="582">14</text>
    <text x="66" y="210">15</text><text x="66" y="306">16</text>
    <text x="775" y="128">17</text><text x="856" y="200">18</text>
    <text x="856" y="392">19</text><text x="856" y="474">20</text>
    <text x="70" y="498">21</text><text x="128" y="580">22</text>
  </g>

  <!-- legend -->
  <g font-family="Georgia" fill="#f0e6d0">
    <text x="460" y="720" text-anchor="middle" font-size="26" font-weight="bold">Puli Meka - apex now has 3 spokes (1 to 2, 3, 4)</text>
    <text x="460" y="752" text-anchor="middle" font-size="18">22 points shown - you said 23: which point am I missing?</text>
  </g>
</svg>
