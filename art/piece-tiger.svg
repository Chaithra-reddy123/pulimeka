<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="tex"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="4" result="n"/>
      <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="2.4" diffuseConstant="1" result="l">
        <feDistantLight azimuth="235" elevation="55"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceGraphic" operator="in" result="li"/>
      <feBlend in="SourceGraphic" in2="li" mode="multiply"/></filter>
    <radialGradient id="t" cx="36%" cy="30%" r="82%">
      <stop offset="0" stop-color="#64534333"/><stop offset="0" stop-color="#645343"/><stop offset="55%" stop-color="#2a2019"/><stop offset="1" stop-color="#0d0805"/>
    </radialGradient>
    <filter id="s"><feGaussianBlur stdDeviation="10"/></filter>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#7a5833"/><stop offset="1" stop-color="#4c371d"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="268" cy="305" rx="175" ry="105" fill="#000" opacity="0.42" filter="url(#s)"/>
  <ellipse cx="256" cy="256" rx="175" ry="140" fill="url(#t)" filter="url(#tex)"/>
  <g stroke="#000" stroke-opacity="0.55" stroke-width="20" fill="none" stroke-linecap="round">
    <path d="M170 140 q40 116 0 232"/>
    <path d="M228 122 q42 130 0 268"/>
    <path d="M292 122 q42 130 0 268"/>
    <path d="M350 140 q40 116 0 232"/>
  </g>
  <g stroke="#c9903f" stroke-opacity="0.3" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M180 140 q40 116 0 232"/><path d="M300 122 q42 130 0 268"/>
  </g>
  <ellipse cx="200" cy="195" rx="66" ry="30" fill="#fff2d8" opacity="0.28"/>
  <text x="256" y="470" font-family="Georgia, serif" font-size="28" fill="#f0e6d0" text-anchor="middle" opacity="0.85">Tiger = dark stone, carved stripes</text>
</svg>
